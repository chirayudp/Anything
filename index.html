<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MoneyQuest — An interactive financial literacy adventure game for Class 11-12 students in Hyderabad, India. Learn budgeting, saving, investing, and digital safety through immersive gameplay." />
    <meta property="og:title" content="MoneyQuest - Financial Literacy Adventure" />
    <meta property="og:description" content="Master your money through an interactive RPG adventure. Budget wisely, save strategically, invest smartly, and stay safe from financial scams." />
    <meta property="og:type" content="website" />
    <!-- Optional: Insert Gemini API Key below for live AI feedback on GitHub Pages, or configure via localStorage.setItem('gemini_api_key', 'YOUR_KEY') or ?geminiKey=... -->
    <meta name="gemini-api-key" content="" />
    <title>MoneyQuest - Financial Literacy Adventure Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <!-- 1. GitHub Pages SPA Routing Support -->
    <script>
      (function() {
        // Restore route when redirected via 404.html on GitHub Pages
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }

        const route = new URLSearchParams(window.location.search).get('route');
        if (route) {
          const basePath = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState({}, '', `${basePath}${route}`);
        }
      })();
    </script>

    <!-- 2. Gemini API Client Configuration & Custom Question Utility -->
    <script>
      (function() {
        // Resolve Gemini API key from URL parameter, localStorage, meta tag, or global
        const urlParams = new URLSearchParams(window.location.search);
        const urlKey = urlParams.get('geminiKey') || urlParams.get('apiKey');
        if (urlKey) {
          try {
            localStorage.setItem('gemini_api_key', urlKey);
          } catch (e) {}
        }

        const metaKey = document.querySelector('meta[name="gemini-api-key"]')?.getAttribute('content')?.trim();
        const storedKey = (function() {
          try {
            return localStorage.getItem('gemini_api_key') || '';
          } catch (e) {
            return '';
          }
        })();

        window.__GEMINI_API_KEY__ = window.__GEMINI_API_KEY__ || urlKey || storedKey || metaKey || '';

        // Global helper to set or update API key at runtime:
        // window.setGeminiApiKey('AIzaSy...')
        window.setGeminiApiKey = function(key) {
          window.__GEMINI_API_KEY__ = (key || '').trim();
          try {
            if (window.__GEMINI_API_KEY__) {
              localStorage.setItem('gemini_api_key', window.__GEMINI_API_KEY__);
            } else {
              localStorage.removeItem('gemini_api_key');
            }
          } catch (e) {}
          console.log('[MoneyQuest] Gemini API Key configuration updated.');
        };

        // Custom Question Utility: Allows asking any custom financial or game question directly to Gemini
        // Usage in browser/console:
        //   await window.askGemini("What is the 50-30-20 rule for student stipends?")
        window.askGemini = async function(question, options = {}) {
          const key = window.__GEMINI_API_KEY__ || (function() {
            try { return localStorage.getItem('gemini_api_key') || ''; } catch (e) { return ''; }
          })();

          if (!key) {
            const promptKey = prompt('Please enter your Gemini API Key to enable custom AI questions:');
            if (promptKey) {
              window.setGeminiApiKey(promptKey.trim());
              return window.askGemini(question, options);
            }
            throw new Error('Gemini API key is required. Call window.setGeminiApiKey("YOUR_KEY") or set in localStorage.');
          }

          const model = options.model || 'gemini-1.5-flash';
          const systemInstruction = options.systemPrompt ||
            'You are an empathetic, expert financial literacy educator for Class 11-12 students in Hyderabad, India. Answer questions practically, concisely, and with student-relatable examples (hostel fees, student stipends, cyber safety, UPI habits).';

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
          const body = {
            contents: [
              {
                parts: [{ text: `${systemInstruction}\n\nStudent Question: ${question}` }]
              }
            ]
          };

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            const err = await response.text();
            throw new Error(`Gemini API error (${response.status}): ${err}`);
          }

          const data = await response.json();
          const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
          return answer;
        };
      })();
    </script>

    <!-- 3. Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
